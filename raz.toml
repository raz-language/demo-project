[package]
name = "raz-package-demo"
version = "0.1.0"
kind = "executable"
source = "src"
entry = "src/main.rz"

[dependencies]
regex = ">=0.2.1"

[dev-dependencies]

[features]
default = []

[profile.debug]
optimization = 2
debug = true
incremental = true

[profile.release]
optimization = 3
debug = false
incremental = true
